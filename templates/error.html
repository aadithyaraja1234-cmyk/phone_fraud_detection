<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>⚠️ {{ title or "Something went wrong" }}</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
<style>
body {font-family:Arial, sans-serif;background:#f5f6fa;text-align:center;margin:0;padding:0 16px;}
.container{margin-top:100px;background:white;display:inline-block;padding:50px;border-radius:20px;box-shadow:0 0 15px #ccc;max-width:480px;box-sizing:border-box;}
h1{color:#2d3436;font-size:24px;}
p{color:#636e72;font-size:15px;line-height:1.5;}
.code{display:inline-block;background:#ffeaea;color:#d63031;border-radius:8px;padding:12px 16px;font-size:14px;margin:16px 0;word-break:break-word;}
a{display:inline-block;margin-top:12px;text-decoration:none;color:white;background:linear-gradient(45deg,#00b894,#0984e3);padding:10px 22px;border-radius:10px;font-weight:bold;}
a:hover{opacity:0.9;}
@media (max-width: 480px) { .container{margin-top:40px;padding:30px 20px;} }
</style>
</head>
<body>
<div class="container">
  <h1>{{ heading or "⚠️ Something went wrong" }}</h1>
  <p>{{ message }}</p>
  <div class="back">
    <a href="/">⬅ Back to Home</a>
  </div>
</div>
</body>
</html>
